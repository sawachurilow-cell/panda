<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Витрина — киоск</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Витрина</div>
    <input class="search" id="search" type="search" placeholder="Поиск товаров…" autocomplete="off" enterkeyhint="search">
    <div class="mode" id="mode-badge"></div>
    <button class="cart-btn" id="cart-btn" aria-label="Корзина">
      🛒 <span class="cart-count" id="cart-count">0</span>
    </button>
  </header>

  <nav class="cats" id="cats"></nav>
  <div class="catinfo" id="catinfo" hidden></div>

  <main class="grid" id="grid">
    <div class="empty" id="grid-empty">Выберите категорию или воспользуйтесь поиском</div>
  </main>
</div>

<!-- Карточка товара -->
<div class="overlay" id="product-overlay" hidden>
  <div class="sheet product-sheet" id="product-sheet"></div>
</div>

<!-- Корзина -->
<div class="overlay" id="cart-overlay" hidden>
  <aside class="drawer" id="cart-drawer">
    <div class="drawer-head">
      <h2>Корзина</h2>
      <button class="close" data-close="cart">✕</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="drawer-foot">
      <div class="total-row"><span>Итого</span><b id="cart-total">0 ₽</b></div>
      <button class="primary big" id="checkout-btn">Оформить заказ</button>
    </div>
  </aside>
</div>

<!-- Оформление: данные клиента -->
<div class="overlay" id="checkout-overlay" hidden>
  <div class="sheet checkout-sheet">
    <div class="drawer-head">
      <h2>Оформление заказа</h2>
      <button class="close" data-close="checkout">✕</button>
    </div>
    <form id="checkout-form" class="form" novalidate>
      <label><span class="cap">ФИО <span class="req">*</span></span>
        <input name="name" type="text" autocomplete="name" placeholder="Иванов Иван Иванович" required>
      </label>
      <label><span class="cap">Телефон <span class="req">*</span></span>
        <input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 900 000-00-00" required>
      </label>
      <label><span class="cap">Адрес разгрузки <span class="req">*</span></span>
        <input name="address" type="text" placeholder="Город, улица, дом" required>
      </label>
      <label><span class="cap">Комментарий</span>
        <textarea name="comment" rows="2" placeholder="Необязательно"></textarea>
      </label>
      <div class="form-error" id="form-error" hidden></div>
      <div class="total-row"><span>К оплате</span><b id="checkout-total">0 ₽</b></div>
      <button type="submit" class="primary big" id="submit-order">Отправить заказ</button>
    </form>
  </div>
</div>

<!-- Экран «спасибо» -->
<div class="overlay" id="done-overlay" hidden>
  <div class="sheet done-sheet">
    <div class="done-emoji">✅</div>
    <h2>Заказ оформлен</h2>
    <p id="done-text"></p>
    <button class="primary big" id="done-btn">Новый заказ</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
